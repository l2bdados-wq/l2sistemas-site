<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L2 Sistemas</title>
  <meta name="description" content="L2 Sistemas — Desenvolvimento de Software" />
  <meta name="theme-color" content="#000000" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='50%25' x2='100%25' y2='50%25'%3E%3Cstop offset='0%25' stop-color='%235B6CF9'/%3E%3Cstop offset='100%25' stop-color='%2310C98A'/%3E%3C/linearGradient%3E%3Cmask id='m'%3E%3Crect width='256' height='256' fill='%23fff'/%3E%3Cpath d='M60 112h20v70h74v20H72q-12 0-12-12Z' fill='%23000'/%3E%3Cpath d='M98 54h86q12 0 12 12v80h-20V74H98Z' fill='%23000'/%3E%3Cpath d='M98 88h40c17 0 26 10 26 23 0 10-5 18-15 27l-27 21h42v15H96v-14l38-32c8-7 11-12 11-17 0-7-5-10-12-10H98Z' fill='%23000'/%3E%3C/mask%3E%3C/defs%3E%3Crect x='16' y='16' width='224' height='224' rx='58' fill='url(%23g)' mask='url(%23m)'/%3E%3C/svg%3E"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    main {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.8s ease-out forwards;
    }

    .logo-svg {
      width: min(320px, 72vw);
      height: auto;
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrapper">
      <svg
        class="logo-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 500 440"
        role="img"
        aria-label="L2 Sistemas"
      >
        <defs>
          <linearGradient id="l2-squircle-grad" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#5B6CF9" />
            <stop offset="50%" stop-color="#2CA8B0" />
            <stop offset="100%" stop-color="#10C98A" />
          </linearGradient>
          <mask id="l2-cutout">
            <rect width="500" height="440" fill="#FFFFFF" />
            <!-- L inferior esquerdo -->
            <path d="M 186 138 L 206 138 L 206 206 L 278 206 L 278 226 L 198 226 Q 186 226 186 214 Z" fill="#000000" />
            <!-- L invertido superior direito -->
            <path d="M 222 84 L 302 84 Q 314 84 314 96 L 314 172 L 294 172 L 294 104 L 222 104 Z" fill="#000000" />
            <!-- Número 2 central -->
            <path d="M 222 116 L 260 116 C 276 116 284 126 284 138 C 284 147 279 155 270 163 L 245 183 L 284 183 L 284 197 L 220 197 L 220 184 L 256 154 C 263 148 266 143 266 138 C 266 132 262 129 255 129 L 222 129 Z" fill="#000000" />
          </mask>
        </defs>

        <!-- Emblema Squircle com recorte transparente -->
        <rect
          x="145"
          y="50"
          width="210"
          height="210"
          rx="54"
          fill="url(#l2-squircle-grad)"
          mask="url(#l2-cutout)"
        />

        <!-- Tipografia L2 Sistemas -->
        <text
          x="250"
          y="348"
          text-anchor="middle"
          fill="#FFFFFF"
          font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="56"
          letter-spacing="-0.5"
        ><tspan font-weight="800">L2</tspan><tspan font-weight="400"> Sistemas</tspan></text>
      </svg>
    </div>
  </main>
</body>
</html>
